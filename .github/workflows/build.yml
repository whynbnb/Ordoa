name: build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Ordoa.slnx
      - name: Build
        run: dotnet build Ordoa.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/Ordoa.Core.Tests/Ordoa.Core.Tests.csproj -c Release --no-build
